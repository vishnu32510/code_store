name: code_store_analytics
description: "Modular Firebase Analytics package with DI support, GoRouter observer, screen tracking, and standard event logging."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.13.1 <4.0.0'
  flutter: '>=3.47.1'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.13.0
  firebase_analytics: ^12.5.0
  get_it: ^9.2.1
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
