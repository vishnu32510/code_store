name: code_store_local_notifications
description: "Modular, offline-ready local notifications and scheduling package supporting foreground banners, scheduled reminders, recurring alarms, rich media, actionable quick buttons, and badges."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.13.1 <4.0.0'
  flutter: '>=3.47.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  dio: ^5.11.0
  path_provider: ^2.1.5
  get_it: ^9.2.1
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
