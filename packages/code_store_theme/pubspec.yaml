name: code_store_theme
description: "Universal Dynamic Theming Engine with Bloc, ThemeExtensions, and micro-animated widgets."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.13.1 <4.0.0'
  flutter: '>=3.47.1'

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
