name: code_store_card_scanner_android
description: Android implementation of the code_store_card_scanner plugin using Google ML Kit.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

flutter:
  plugin:
    implements: code_store_card_scanner
    platforms:
      android:
        dartPluginClass: CardScannerAndroid

dependencies:
  flutter:
    sdk: flutter
  code_store_card_scanner_platform_interface:
    path: ../code_store_card_scanner_platform_interface
  google_mlkit_text_recognition: ^0.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
