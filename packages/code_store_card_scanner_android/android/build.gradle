group 'com.nungu.codestore.card_scanner_android'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.nungu.codestore.card_scanner_android'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
}
