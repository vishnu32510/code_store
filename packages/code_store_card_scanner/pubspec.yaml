name: code_store_card_scanner
description: "Modular debit and credit card scanning, regex-based brand detection, and details form package for code_store."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.13.1 <4.0.0'
  flutter: '>=3.47.1'

dependencies:
  flutter:
    sdk: flutter
  apple_vision_commons: ^0.0.3
  apple_vision_recognize_text: ^0.0.4
  camera: ^0.12.1
  flutter_credit_card_scanner: ^0.12.0
  google_mlkit_text_recognition: ^0.15.1
  get_it: ^9.2.1
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
