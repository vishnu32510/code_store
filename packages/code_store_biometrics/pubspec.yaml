name: code_store_biometrics
description: "Modular, offline-ready biometric authentication package supporting Face ID, Touch ID, Android BiometricPrompt (Fingerprint, Face, Iris), and device passcode fallbacks."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.13.1 <4.0.0'
  flutter: '>=3.47.1'

dependencies:
  flutter:
    sdk: flutter
  local_auth: ^2.3.0
  get_it: ^9.2.1
  meta: ^1.19.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
