name: code_store_connectivity
description: "Modular real-time network connectivity monitor with offline banners, status streams, and connection type detection."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.13.1 <4.0.0'
  flutter: '>=3.47.1'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.3
  get_it: ^9.2.1
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
