    sdk: flutter
  permission_handler: ^11.4.0
  get_it: ^9.2.1
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
