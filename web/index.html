<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="codestore">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>codestore</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Identity Services (Google One Tap on Web) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>


  <style id="splash-styles">
    html, body {
      background-color: #121212 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #splash-loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #121212;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.4s ease-out;
    }
    #splash-logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      animation: pulse-logo 1.6s ease-in-out infinite alternate;
    }
    #splash-footer {
      position: absolute;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    #splash-footer img {
      height: 44px;
      object-fit: contain;
    }
    #splash-footer span {
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.3px;
    }
    @keyframes pulse-logo {
      0% { transform: scale(0.96); opacity: 0.9; }
      100% { transform: scale(1.04); opacity: 1; }
    }
  </style>
</head>
<body style="background-color: #121212;">
  <div id="splash-loading">
    <img id="splash-logo" src="splash_logo.png" alt="Logo">
    <div id="splash-footer">
      <img src="splash_branding.png" alt="Branding">
      <span>Powered by Nungu</span>
    </div>
  </div>
  <script>
    // Remove pre-Flutter HTML splash as soon as Flutter's first frame renders
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash-loading');
      if (splash) {
        splash.style.display = 'none';
        splash.remove();
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
