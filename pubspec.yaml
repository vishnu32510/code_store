name: code_store
description: "Flutter template: features (auth, theme), DI, toast, Firebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.1 <4.0.0'
  flutter: '>=3.47.1'

dependencies:
  flutter:
    sdk: flutter

  # Modular Packages
  code_store_core:
    path: packages/code_store_core
  code_store_theme:
    path: packages/code_store_theme
  code_store_auth:
    path: packages/code_store_auth
  code_store_home_widget:
    path: packages/code_store_home_widget
  code_store_analytics:
    path: packages/code_store_analytics
  code_store_messaging:
    path: packages/code_store_messaging

  # State management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Firebase & Authentication
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_analytics: ^12.5.0
  firebase_messaging: ^16.1.0
  cloud_firestore: ^6.8.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

  # Network & Utilities
  dio: ^5.11.0
  go_router: ^18.0.0
  url_launcher: ^6.3.2
  flutter_cache_manager: ^3.4.2
  flutter_dotenv: ^6.0.1
  meta: ^1.19.0

  # Hardware / Media
  gal: ^2.3.3
  torch_light: ^2.0.0

  # DI
  get_it: ^9.2.1

  # UI
  cupertino_icons: ^1.0.8
  percent_indicator: ^4.0.0
  home_widget: ^0.9.2

dev_dependencies:
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - .env
