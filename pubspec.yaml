name: code_store
description: "Flutter template: features (auth, theme), DI, toast, Firebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  bloc: ^8.1.4
  flutter_bloc: ^8.1.5
  equatable: ^2.0.7

  # Firebase & Authentication
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.6
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4

  # Network & Utilities
  dio: ^5.9.2
  go_router: ^14.6.2
  url_launcher: ^6.3.2
  flutter_cache_manager: ^3.3.2
  flutter_dotenv: ^5.2.1
  meta: ^1.8.0

  # Hardware / Media
  gal: ^2.3.0
  torch_light: ^1.1.0
  # Home Widget (not used App Widget)
  home_widget: ^0.9.2+1

  # DI
  get_it: ^8.0.3

  # UI
  cupertino_icons: ^1.0.8
  percent_indicator: ^4.0.0

dev_dependencies:
  change_app_package_name: ^1.5.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

  # Home Widget (not used App Widget)
  # home_widget_cli: ^0.0.1
  # home_widget_generator: ^0.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
