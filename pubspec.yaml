name: code_store
description: "Flutter template: features (auth, theme), DI, toast, Firebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.1 <4.0.0'
  flutter: '>=3.47.1'

dependencies:
  flutter:
    sdk: flutter

  # Modular Packages
  code_store_core:
    path: packages/code_store_core
  code_store_theme:
    path: packages/code_store_theme
  code_store_auth:
    path: packages/code_store_auth
  code_store_home_widget:
    path: packages/code_store_home_widget
  code_store_analytics:
    path: packages/code_store_analytics
  code_store_local_notifications:
    path: packages/code_store_local_notifications
  code_store_messaging:
    path: packages/code_store_messaging
  code_store_biometrics:
    path: packages/code_store_biometrics

  # State management (used directly in app feature code)
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Firebase Core (required at app level for Firebase.initializeApp())
  firebase_core: ^4.13.0

  # DI — kept direct because app code uses getIt<> throughout
  get_it: ^9.2.1

  # Network & Utilities
  go_router: ^18.0.0
  flutter_cache_manager: ^3.4.2
  flutter_dotenv: ^6.0.1
  meta: ^1.19.0

  # Hardware / Media
  torch_light: ^2.0.0

  # UI
  cupertino_icons: ^1.0.8
  percent_indicator: ^4.0.0
  home_widget: ^0.9.2

dev_dependencies:
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - .env
